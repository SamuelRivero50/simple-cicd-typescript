<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sum Two Numbers :) </title>
</head>
<body>
  <h1>Calculator</h1>
  <label>
    Number 1
    <input type="number" id="num1" placeholder="First number" />
  </label>
  <label>
    Operation
    <select id="operation">
      <option value="sum">+</option>
      <option value="subtract">−</option>
      <option value="multiply">×</option>
      <option value="divide">÷</option>
    </select>
  </label>
  <label>
    Number 2
    <input type="number" id="num2" placeholder="Second number" />
  </label>
  <button type="button" id="btnCalculate">Calculate</button>
  <p>Result: <strong id="result">—</strong></p>

  <!-- Link to the compiled JS (compile calculator.ts with: tsc calculator.ts) -->
  <script src="calculator.js"></script>
  <script>
    function formatResult(value) {
      return Number.isFinite(value) ? value : "Error";
    }

    function calculate() {
      var a = Number(document.getElementById('num1').value);
      var b = Number(document.getElementById('num2').value);
      var op = document.getElementById('operation').value;
      var resultEl = document.getElementById('result');

      try {
        var result;
        if (op === 'sum') result = window.sum(a, b);
        else if (op === 'subtract') result = window.subtract(a, b);
        else if (op === 'multiply') result = window.multiply(a, b);
        else if (op === 'divide') result = window.divide(a, b);
        else result = 'Invalid operation';
        resultEl.textContent = formatResult(result);
      } catch (e) {
        resultEl.textContent = e instanceof Error ? e.message : 'Error';
      }
    }

    document.getElementById('btnCalculate').addEventListener('click', calculate);
  </script>
</body>
</html>
